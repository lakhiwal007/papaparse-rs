[workspace]
resolver = "3"
members = [
    "crates/papaparse",
    "crates/papaparse-cli",
    "crates/papaparse-tape",
    "crates/papaparse-wasm",
    "crates/papaparse-node",
    "bench/rust",
]
default-members = ["crates/papaparse", "crates/papaparse-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/lakhiwal007/papaparse-rs"
homepage = "https://github.com/lakhiwal007/papaparse-rs"
keywords = ["csv", "parser", "papaparse", "delimited", "tsv"]
categories = ["encoding", "parser-implementations", "text-processing"]

[workspace.dependencies]
# Defaults off here so members can opt out (cargo before 1.86 can't override them per member).
papaparse = { path = "crates/papaparse", version = "0.1.0", default-features = false }
papaparse-tape = { path = "crates/papaparse-tape" }

anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
criterion = { version = "0.8.2", features = ["html_reports"] }
dhat = "0.3.3"
js-sys = "0.3.106"
memchr = { version = "2.8.3", default-features = false, features = ["std"] }
napi = { version = "3.14.2", default-features = false, features = ["napi4"] }
napi-build = "2.6.0"
napi-derive = { version = "3.6.12", default-features = false, features = ["strict"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wasm-bindgen = "0.2.129"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
# Pedantic lints that fight the 1:1 port style more than they help.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
cast_precision_loss = "allow"
too_many_lines = "allow"
many_single_char_names = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.bench]
inherits = "release"
debug = true
strip = "none"

# Profile for the Node-API addon (scripts/build-node.sh). A native addon must not abort
# on panic: that would kill the host Node process. With unwinding, NAPI-RS turns a
# panic into a JS exception.
[profile.node-release]
inherits = "release"
panic = "unwind"

# Profile for the wasm package (`--profile wasm-release`, see scripts/build-wasm.sh).
# Measured: opt-level 3 is ~40% faster than "z" for +2.6 KB gzipped, so speed wins.
[profile.wasm-release]
inherits = "release"
opt-level = 3
