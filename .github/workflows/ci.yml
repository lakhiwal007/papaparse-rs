name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show # installs the toolchain pinned in rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features
      - run: cargo test -p papaparse --no-default-features
      - name: Conformance scoreboard
        if: matrix.os == 'ubuntu-latest'
        run: CONFORMANCE_REPORT=1 cargo test -p papaparse --test conformance -- --nocapture >> "$GITHUB_STEP_SUMMARY"

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.85 check -p papaparse --all-features

  wasm:
    name: wasm package (conformance, streaming, differential vs PapaParse)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - run: sudo apt-get update && sudo apt-get install -y binaryen
      - run: scripts/build-wasm.sh
      - run: cd bench && npm ci --no-audit --no-fund
      - run: node tests/js/conformance.cjs crates/papaparse-wasm/pkg
      - run: node tests/js/streaming.cjs crates/papaparse-wasm/pkg
      - run: node tests/js/differential.cjs crates/papaparse-wasm/pkg 50000 ${{ github.run_number }}
      - name: Size budget (gzipped wasm < 88 KiB)
        run: test "$(gzip -9c crates/papaparse-wasm/pkg/papaparse_wasm_bg.wasm | wc -c)" -lt 90112

  node-addon:
    name: napi-rs addon (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: scripts/build-node.sh
        shell: bash
      - run: cd bench && npm ci --no-audit --no-fund
        shell: bash
      - run: node tests/js/conformance.cjs crates/papaparse-node/pkg
      - run: node tests/js/streaming.cjs crates/papaparse-node/pkg
      - run: node tests/js/differential.cjs crates/papaparse-node/pkg 50000 ${{ github.run_number }}
      - name: npm packaging (platform package loaded through the optional dependency)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p dist install/node_modules
          cp crates/papaparse-node/pkg/papaparse.node dist/papaparse.x86_64-unknown-linux-gnu.node
          node scripts/npm-packages.mjs dist npm
          cp -R npm/* install/node_modules/
          node tests/js/conformance.cjs install/node_modules/papaparse-node

  miri:
    name: miri (undefined behaviour)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - run: cargo +nightly miri test -p papaparse --lib --test callbacks

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  fuzz:
    name: fuzz (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - run: cargo +nightly fuzz run parse -- -max_total_time=60
      - run: cargo +nightly fuzz run chunked -- -max_total_time=60
      - run: cargo +nightly fuzz run unparse -- -max_total_time=60

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show && rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info
