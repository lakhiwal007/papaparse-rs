[package]
name = "papaparse-node"
description = "Native Node.js addon (Node-API, via NAPI-RS) exposing the papaparse crate with the Papa.parse API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]
# Tested from JS (tests/js/*.cjs) against a real Node runtime; a Rust test binary can't
# resolve Node-API symbols.
test = false
doctest = false

[dependencies]
napi.workspace = true
napi-derive.workspace = true
papaparse-tape.workspace = true

[build-dependencies]
napi-build.workspace = true

# Same as [workspace.lints] except for `unsafe_code`.
[lints.rust]
# `deny`, not `forbid`: NAPI-RS macros emit `#[allow(unsafe_code)]` FFI glue.
# Hand-written `unsafe` in this crate is still rejected.
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
# Pedantic lints that fight the 1:1 port style more than they help.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
cast_precision_loss = "allow"
too_many_lines = "allow"
many_single_char_names = "allow"
